<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운석 피하기 — 브랜치 실험용</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>☄️ 운석 피하기</h1>
<p class="sub">난이도는 <code>설정.js</code> 에서만 바꿉니다. 브랜치를 바꿔 보세요.</p>

<div class="판">
  <div class="왼쪽">
    <canvas id="무대" width="420" height="560"></canvas>
    <p id="안내" class="안내">"시작" 을 누르세요</p>
  </div>

  <div class="오른쪽">
    <div class="상자">
      <div class="상자제목">현재 난이도</div>
      <div class="난이도이름" id="난이도이름">-</div>
      <div id="난이도표"></div>
    </div>

    <div class="상자">
      <div class="상자제목">점수</div>
      <div class="점수줄"><span>피한 운석</span><b id="점수">0</b></div>
      <div class="점수줄"><span>최고 기록</span><b id="최고">0</b></div>
    </div>

    <button id="시작">시작</button>

    <div class="상자 도움말">
      <div class="상자제목">조작</div>
      <p>← → 방향키 또는 마우스 이동</p>
      <p>스페이스바로 다시 시작</p>
    </div>
  </div>
</div>

<!-- ⚠️ 순서가 중요합니다.
     설정.js 가 먼저 읽혀야 게임.js 가 설정을 쓸 수 있습니다. -->
<script src="설정.js"></script>
<script src="게임.js"></script>

</body>
</html>
